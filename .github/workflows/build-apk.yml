# Builds a signed Android APK (and, when requested, an AAB) for one Studio
# App Builder app, triggered by the backend (backend/app/routers/
# apk_builds.py) via the GitHub REST API — never runs on the production
# VPS. Wraps the app's exported static HTML/CSS/JS bundle (produced
# client-side by frontend/src/utils/exportApp.js) with Capacitor and
# reports the result back to the backend via a one-time callback token.
#
# The APK is ALWAYS signed with the app's own persistent signing key (the
# same one AAB/Google Play builds use — backend/app/routers/apk_builds.py's
# _get_or_create_signing_key), not the Android SDK's auto-generated debug
# keystore. A fresh GitHub Actions runner has no ~/.android/debug.keystore,
# so `assembleDebug` would mint a NEW random one on every single run —
# Android refuses to install an "update" whose signature doesn't match the
# already-installed app, forcing a full uninstall before every reinstall.
# Signing with the app's own stable key (assembleRelease, same
# -Pandroid.injected.signing.* mechanism bundleRelease already used) fixes
# that: the signature is the same across every rebuild of a given app.
#
# This repo is PUBLIC, so workflow_dispatch inputs are visible forever to
# anyone in the Actions run history. The signing keystore + passwords are
# therefore never passed as inputs — only a one-time, unguessable
# signing_url is, which is fetched here and every value from it is masked
# with ::add-mask:: the instant it's read, before it's used anywhere else.
name: Build Studio App APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "apk_builds document ID (Mongo)"
        required: true
      bundle_url:
        description: "Public URL of the exported HTML/CSS/JS .zip bundle"
        required: true
      callback_url:
        description: "Backend URL to report the result to"
        required: true
      callback_token:
        description: "One-time secret for the callback (never reused)"
        required: true
      app_name:
        description: "Display name for the generated app"
        required: false
        default: "Studio App"
      package_id:
        description: "Reverse-DNS Android package name, e.g. com.vakar.mypizzaapp"
        required: false
        default: "com.vakargames.studioapp"
      min_sdk:
        description: "minSdkVersion"
        required: false
        default: "22"
      target_sdk:
        description: "targetSdkVersion (also used as compileSdkVersion)"
        required: false
        default: "34"
      version_code:
        description: "versionCode — Android's internal build number, must strictly increase between Play Store uploads"
        required: false
        default: "1"
      version_name:
        description: "versionName — free-form, user-facing app version, e.g. 1.0a"
        required: false
        default: "1.0"
      icon_url:
        description: "Public URL of a source app icon (square, 1024x1024+) — blank to keep Capacitor's default"
        required: false
        default: ""
      build_aab:
        description: "\"true\" to also produce a signed .aab (Google Play) alongside the signed APK"
        required: false
        default: "false"
      signing_url:
        description: "One-time URL to fetch {keystore_b64, store_password, key_password, key_alias} JSON from — used to sign the APK (and the AAB, when build_aab is true)"
        required: true
      needs_pedometer:
        description: "\"true\" to inject the native Pedometer plugin (step counter) — only for apps that use one of the pedometer blocks"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch and unpack the app bundle
        run: |
          mkdir -p www build-project
          curl -sfL "${{ inputs.bundle_url }}" -o bundle.zip
          unzip -oq bundle.zip -d www
          ls -la www

      - name: Scaffold a Capacitor project
        working-directory: build-project
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp -r ../www ./www
          npx cap init "${{ inputs.app_name }}" "${{ inputs.package_id }}" --web-dir www
          npx cap add android

      - name: Apply Min/Target SDK
        working-directory: build-project/android
        run: |
          sed -i "s/minSdkVersion = .*/minSdkVersion = ${{ inputs.min_sdk }}/" variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = ${{ inputs.target_sdk }}/" variables.gradle
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = ${{ inputs.target_sdk }}/" variables.gradle
          cat variables.gradle

      - name: Apply version code/name
        working-directory: build-project/android/app
        run: |
          sed -i "s/versionCode .*/versionCode ${{ inputs.version_code }}/" build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.version_name }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Apply custom app icon
        if: inputs.icon_url != ''
        working-directory: build-project
        run: |
          mkdir -p assets
          curl -sfL "${{ inputs.icon_url }}" -o assets/icon.png
          npm install --no-audit --no-fund @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor "#ffffff" --iconBackgroundColorDark "#1D1D1F"

      - name: Add native Pedometer plugin
        if: inputs.needs_pedometer == 'true'
        working-directory: build-project/android
        run: |
          PKG_PATH=$(echo "${{ inputs.package_id }}" | tr '.' '/')
          JAVA_DIR="app/src/main/java/$PKG_PATH"
          mkdir -p "$JAVA_DIR"
          cat > "$JAVA_DIR/PedometerPlugin.java" << 'JAVAEOF'
          package ${{ inputs.package_id }};

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Build;
          import android.Manifest;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          // Real device step counting for the App Builder's "start counting
          // steps" block (see frontend/src/appBuilderBlock/{blocks,runtime}.js)
          // — wraps Android's own Sensor.TYPE_STEP_COUNTER, a cumulative count
          // since the device's last reboot, into a "steps since tracking
          // started today" number via a SharedPreferences baseline reset once
          // per calendar day. Only injected for apps that actually use a
          // pedometer block (see apk_builds.py's needs_pedometer check).
          @CapacitorPlugin(
              name = "Pedometer",
              permissions = { @Permission(strings = { Manifest.permission.ACTIVITY_RECOGNITION }, alias = "activity") }
          )
          public class PedometerPlugin extends Plugin implements SensorEventListener {
              private static final String PREFS = "vk_pedometer";
              private SensorManager sensorManager;
              private Sensor stepSensor;
              private float rawTotal = -1f;
              private float baseline = -1f;

              @Override
              public void load() {
                  sensorManager = (SensorManager) getContext().getSystemService(Context.SENSOR_SERVICE);
                  stepSensor = sensorManager != null ? sensorManager.getDefaultSensor(Sensor.TYPE_STEP_COUNTER) : null;
              }

              @PluginMethod
              public void isAvailable(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("available", stepSensor != null);
                  call.resolve(ret);
              }

              @PluginMethod
              public void requestPermission(PluginCall call) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q || getPermissionState("activity") == PermissionState.GRANTED) {
                      JSObject ret = new JSObject();
                      ret.put("granted", true);
                      call.resolve(ret);
                      return;
                  }
                  requestPermissionForAlias("activity", call, "permissionCallback");
              }

              @PermissionCallback
              private void permissionCallback(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("granted", getPermissionState("activity") == PermissionState.GRANTED);
                  call.resolve(ret);
              }

              @PluginMethod
              public void start(PluginCall call) {
                  if (stepSensor == null) {
                      call.reject("No step counter sensor on this device.");
                      return;
                  }
                  SharedPreferences prefs = getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  String today = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date());
                  String savedDay = prefs.getString("day", "");
                  if (today.equals(savedDay)) {
                      baseline = prefs.getFloat("baseline", -1f);
                  } else {
                      prefs.edit().putString("day", today).putFloat("baseline", -1f).apply();
                      baseline = -1f;
                  }
                  sensorManager.registerListener(this, stepSensor, SensorManager.SENSOR_DELAY_UI);
                  // Arms (or re-arms) the midnight snapshot alarm — see
                  // PedometerMidnightReceiver — so today's baseline is still
                  // captured close to midnight even on a day the app never
                  // gets reopened after this.
                  PedometerMidnightReceiver.schedule(getContext().getApplicationContext());
                  call.resolve();
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  if (sensorManager != null) sensorManager.unregisterListener(this);
                  call.resolve();
              }

              @PluginMethod
              public void getSteps(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("steps", currentSteps());
                  call.resolve(ret);
              }

              private int currentSteps() {
                  if (rawTotal < 0 || baseline < 0) return 0;
                  int steps = (int) (rawTotal - baseline);
                  return Math.max(0, steps);
              }

              @Override
              public void onSensorChanged(SensorEvent event) {
                  if (event.sensor.getType() != Sensor.TYPE_STEP_COUNTER) return;
                  rawTotal = event.values[0];
                  if (baseline < 0) {
                      baseline = rawTotal;
                      SharedPreferences prefs = getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      prefs.edit().putFloat("baseline", baseline).apply();
                  }
                  JSObject data = new JSObject();
                  data.put("steps", currentSteps());
                  notifyListeners("stepsUpdate", data);
              }

              @Override
              public void onAccuracyChanged(Sensor sensor, int accuracy) {}

              @Override
              protected void handleOnDestroy() {
                  if (sensorManager != null) sensorManager.unregisterListener(this);
                  super.handleOnDestroy();
              }
          }
          JAVAEOF

          cat > "$JAVA_DIR/PedometerMidnightReceiver.java" << 'MIDNIGHTEOF'
          package ${{ inputs.package_id }};

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Handler;
          import android.os.Looper;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Locale;

          // Keeps the Fitness dashboard's "steps today" accurate even on a day
          // the app is never opened at all: PedometerPlugin's own daily
          // baseline only resets the moment someone actually opens the app, so
          // steps taken earlier that day would otherwise be missing from the
          // count until the NEXT reset. This receiver runs independently of
          // the app's process — scheduled once via AlarmManager for the next
          // midnight, re-scheduling itself every time it fires, and re-armed
          // on every device boot (alarms don't survive a reboot on their own).
          //
          // Deliberately NOT a persistent foreground service — no ongoing
          // notification, negligible battery impact: this wakes up for at
          // most a few seconds once a day, reads the step sensor's current
          // cumulative value once, saves it as the new day's baseline, and
          // goes back to sleep.
          public class PedometerMidnightReceiver extends BroadcastReceiver {
              private static final String PREFS = "vk_pedometer";
              private static final String ACTION_MIDNIGHT = "${{ inputs.package_id }}.PEDOMETER_MIDNIGHT";
              private static final int REQUEST_CODE = 4821;

              public static void schedule(Context context) {
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  Intent intent = new Intent(context, PedometerMidnightReceiver.class);
                  intent.setAction(ACTION_MIDNIGHT);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
                  PendingIntent pending = PendingIntent.getBroadcast(context, REQUEST_CODE, intent, flags);
                  Calendar cal = Calendar.getInstance();
                  cal.add(Calendar.DAY_OF_YEAR, 1);
                  cal.set(Calendar.HOUR_OF_DAY, 0);
                  cal.set(Calendar.MINUTE, 0);
                  cal.set(Calendar.SECOND, 5);
                  cal.set(Calendar.MILLISECOND, 0);
                  try {
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pending);
                  } catch (Exception e) {
                      // Some OEMs restrict background alarm scheduling — the
                      // plugin's own open-the-app baseline reset still works
                      // either way, this is a best-effort improvement on top.
                  }
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  String action = intent != null ? intent.getAction() : null;
                  boolean isBoot = Intent.ACTION_BOOT_COMPLETED.equals(action);
                  boolean isMidnight = ACTION_MIDNIGHT.equals(action);
                  if (isBoot || isMidnight) {
                      schedule(context.getApplicationContext());
                  }
                  if (!isMidnight) return;

                  final Context appContext = context.getApplicationContext();
                  final SensorManager sensorManager = (SensorManager) appContext.getSystemService(Context.SENSOR_SERVICE);
                  final Sensor stepSensor = sensorManager != null ? sensorManager.getDefaultSensor(Sensor.TYPE_STEP_COUNTER) : null;
                  if (sensorManager == null || stepSensor == null) return;

                  final PendingResult pendingResult = goAsync();
                  final SensorEventListener[] listenerHolder = new SensorEventListener[1];
                  final Handler timeoutHandler = new Handler(Looper.getMainLooper());
                  final boolean[] finished = { false };

                  final Runnable finishOnce = new Runnable() {
                      @Override
                      public void run() {
                          if (finished[0]) return;
                          finished[0] = true;
                          if (listenerHolder[0] != null) sensorManager.unregisterListener(listenerHolder[0]);
                          pendingResult.finish();
                      }
                  };

                  listenerHolder[0] = new SensorEventListener() {
                      @Override
                      public void onSensorChanged(SensorEvent event) {
                          if (event.sensor.getType() != Sensor.TYPE_STEP_COUNTER) return;
                          SharedPreferences prefs = appContext.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                          String today = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date());
                          prefs.edit().putString("day", today).putFloat("baseline", event.values[0]).apply();
                          timeoutHandler.removeCallbacksAndMessages(null);
                          finishOnce.run();
                      }
                      @Override
                      public void onAccuracyChanged(Sensor sensor, int accuracy) {}
                  };
                  sensorManager.registerListener(listenerHolder[0], stepSensor, SensorManager.SENSOR_DELAY_UI);
                  // The sensor should report almost immediately upon
                  // registering, but never hold the broadcast open forever if
                  // it somehow doesn't.
                  timeoutHandler.postDelayed(finishOnce, 8000);
              }
          }
          MIDNIGHTEOF

          cat > "$JAVA_DIR/MainActivity.java" << 'MAINEOF'
          package ${{ inputs.package_id }};

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PedometerPlugin.class);
                  super.onCreate(savedInstanceState);
                  PedometerMidnightReceiver.schedule(getApplicationContext());
              }
          }
          MAINEOF

          python3 -c "
          import re
          path = 'app/src/main/AndroidManifest.xml'
          with open(path) as f:
              xml = f.read()
          xml = xml.replace('<application', '<uses-permission android:name=\"android.permission.ACTIVITY_RECOGNITION\" />\n    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />\n    <application', 1)
          receiver_xml = '''    <receiver android:name=\".PedometerMidnightReceiver\" android:enabled=\"true\" android:exported=\"true\">
              <intent-filter>
                  <action android:name=\"android.intent.action.BOOT_COMPLETED\" />
                  <action android:name=\"${{ inputs.package_id }}.PEDOMETER_MIDNIGHT\" />
              </intent-filter>
          </receiver>
          '''
          xml = xml.replace('</application>', receiver_xml + '</application>', 1)
          with open(path, 'w') as f:
              f.write(xml)
          "
          cat "$JAVA_DIR/MainActivity.java"
          grep -E 'ACTIVITY_RECOGNITION|RECEIVE_BOOT_COMPLETED|PedometerMidnightReceiver' app/src/main/AndroidManifest.xml

      - name: Fetch signing key
        working-directory: build-project/android
        run: |
          curl -sfL "${{ inputs.signing_url }}" -o /tmp/signing.json
          STORE_PASS=$(python3 -c "import json;print(json.load(open('/tmp/signing.json'))['store_password'])")
          KEY_PASS=$(python3 -c "import json;print(json.load(open('/tmp/signing.json'))['key_password'])")
          KEY_ALIAS=$(python3 -c "import json;print(json.load(open('/tmp/signing.json'))['key_alias'])")
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          python3 -c "import json,base64;d=json.load(open('/tmp/signing.json'));open('app/upload-key.p12','wb').write(base64.b64decode(d['keystore_b64']))"
          rm -f /tmp/signing.json
          {
            echo "STORE_PASS=$STORE_PASS"
            echo "KEY_PASS=$KEY_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: build-project/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/upload-key.p12" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build signed AAB
        if: inputs.build_aab == 'true'
        working-directory: build-project/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/upload-key.p12" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Clean up the signing key file
        if: always()
        working-directory: build-project/android
        run: rm -f app/upload-key.p12

      - name: Report success
        if: success()
        run: |
          APK_PATH="build-project/android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="build-project/android/app/build/outputs/bundle/release/app-release.aab"
          ARGS=(-F "callback_token=${{ inputs.callback_token }}" -F "status=ready" -F "apk=@${APK_PATH};type=application/vnd.android.package-archive")
          if [ "${{ inputs.build_aab }}" = "true" ] && [ -f "$AAB_PATH" ]; then
            ARGS+=(-F "aab=@${AAB_PATH};type=application/octet-stream")
          fi
          curl -sf -X POST "${{ inputs.callback_url }}" "${ARGS[@]}"

      - name: Report failure
        if: failure()
        run: |
          curl -sf -X POST "${{ inputs.callback_url }}" \
            -F "callback_token=${{ inputs.callback_token }}" \
            -F "status=failed" \
            -F "error=Build failed — see the GitHub Actions run for ${{ github.run_id }} for details." \
          || true
