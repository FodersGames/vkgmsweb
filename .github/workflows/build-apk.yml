# Builds a signed Android APK (and, when requested, an AAB) for one Studio
# App Builder app, triggered by the backend (backend/app/routers/
# apk_builds.py) via the GitHub REST API — never runs on the production
# VPS. Wraps the app's exported static HTML/CSS/JS bundle (produced
# client-side by frontend/src/utils/exportApp.js) with Capacitor and
# reports the result back to the backend via a one-time callback token.
#
# The APK is ALWAYS signed with the app's own persistent signing key (the
# same one AAB/Google Play builds use — backend/app/routers/apk_builds.py's
# _get_or_create_signing_key), not the Android SDK's auto-generated debug
# keystore. A fresh GitHub Actions runner has no ~/.android/debug.keystore,
# so `assembleDebug` would mint a NEW random one on every single run —
# Android refuses to install an "update" whose signature doesn't match the
# already-installed app, forcing a full uninstall before every reinstall.
# Signing with the app's own stable key (assembleRelease, same
# -Pandroid.injected.signing.* mechanism bundleRelease already used) fixes
# that: the signature is the same across every rebuild of a given app.
#
# This repo is PUBLIC, so workflow_dispatch inputs are visible forever to
# anyone in the Actions run history. The signing keystore + passwords are
# therefore never passed as inputs — only a one-time, unguessable
# signing_url is, which is fetched here and every value from it is masked
# with ::add-mask:: the instant it's read, before it's used anywhere else.
name: Build Studio App APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "apk_builds document ID (Mongo)"
        required: true
      bundle_url:
        description: "Public URL of the exported HTML/CSS/JS .zip bundle"
        required: true
      callback_url:
        description: "Backend URL to report the result to"
        required: true
      callback_token:
        description: "One-time secret for the callback (never reused)"
        required: true
      app_name:
        description: "Display name for the generated app"
        required: false
        default: "Studio App"
      package_id:
        description: "Reverse-DNS Android package name, e.g. com.vakar.mypizzaapp"
        required: false
        default: "com.vakargames.studioapp"
      min_sdk:
        description: "minSdkVersion"
        required: false
        default: "22"
      target_sdk:
        description: "targetSdkVersion (also used as compileSdkVersion)"
        required: false
        default: "34"
      version_code:
        description: "versionCode — Android's internal build number, must strictly increase between Play Store uploads"
        required: false
        default: "1"
      version_name:
        description: "versionName — free-form, user-facing app version, e.g. 1.0a"
        required: false
        default: "1.0"
      icon_url:
        description: "Public URL of a source app icon (square, 1024x1024+) — blank to keep Capacitor's default"
        required: false
        default: ""
      build_aab:
        description: "\"true\" to also produce a signed .aab (Google Play) alongside the signed APK"
        required: false
        default: "false"
      signing_url:
        description: "One-time URL to fetch {keystore_b64, store_password, key_password, key_alias} JSON from — used to sign the APK (and the AAB, when build_aab is true)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch and unpack the app bundle
        run: |
          mkdir -p www build-project
          curl -sfL "${{ inputs.bundle_url }}" -o bundle.zip
          unzip -oq bundle.zip -d www
          ls -la www

      - name: Scaffold a Capacitor project
        working-directory: build-project
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp -r ../www ./www
          npx cap init "${{ inputs.app_name }}" "${{ inputs.package_id }}" --web-dir www
          npx cap add android

      - name: Apply Min/Target SDK
        working-directory: build-project/android
        run: |
          sed -i "s/minSdkVersion = .*/minSdkVersion = ${{ inputs.min_sdk }}/" variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = ${{ inputs.target_sdk }}/" variables.gradle
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = ${{ inputs.target_sdk }}/" variables.gradle
          cat variables.gradle

      - name: Apply version code/name
        working-directory: build-project/android/app
        run: |
          sed -i "s/versionCode .*/versionCode ${{ inputs.version_code }}/" build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.version_name }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Apply custom app icon
        if: inputs.icon_url != ''
        working-directory: build-project
        run: |
          mkdir -p assets
          curl -sfL "${{ inputs.icon_url }}" -o assets/icon.png
          npm install --no-audit --no-fund @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor "#ffffff" --iconBackgroundColorDark "#1D1D1F"

      - name: Fetch signing key
        working-directory: build-project/android
        run: |
          curl -sfL "${{ inputs.signing_url }}" -o /tmp/signing.json
          STORE_PASS=$(python3 -c "import json;print(json.load(open('/tmp/signing.json'))['store_password'])")
          KEY_PASS=$(python3 -c "import json;print(json.load(open('/tmp/signing.json'))['key_password'])")
          KEY_ALIAS=$(python3 -c "import json;print(json.load(open('/tmp/signing.json'))['key_alias'])")
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          python3 -c "import json,base64;d=json.load(open('/tmp/signing.json'));open('app/upload-key.p12','wb').write(base64.b64decode(d['keystore_b64']))"
          rm -f /tmp/signing.json
          {
            echo "STORE_PASS=$STORE_PASS"
            echo "KEY_PASS=$KEY_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: build-project/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/upload-key.p12" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build signed AAB
        if: inputs.build_aab == 'true'
        working-directory: build-project/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/upload-key.p12" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Clean up the signing key file
        if: always()
        working-directory: build-project/android
        run: rm -f app/upload-key.p12

      - name: Report success
        if: success()
        run: |
          APK_PATH="build-project/android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="build-project/android/app/build/outputs/bundle/release/app-release.aab"
          ARGS=(-F "callback_token=${{ inputs.callback_token }}" -F "status=ready" -F "apk=@${APK_PATH};type=application/vnd.android.package-archive")
          if [ "${{ inputs.build_aab }}" = "true" ] && [ -f "$AAB_PATH" ]; then
            ARGS+=(-F "aab=@${AAB_PATH};type=application/octet-stream")
          fi
          curl -sf -X POST "${{ inputs.callback_url }}" "${ARGS[@]}"

      - name: Report failure
        if: failure()
        run: |
          curl -sf -X POST "${{ inputs.callback_url }}" \
            -F "callback_token=${{ inputs.callback_token }}" \
            -F "status=failed" \
            -F "error=Build failed — see the GitHub Actions run for ${{ github.run_id }} for details." \
          || true
